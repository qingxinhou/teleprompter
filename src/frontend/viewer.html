<!DOCTYPE html>
<html lang="zh-CN" class="wa-theme-shoelace wa-palette-shoelace wa-brand-blue wa-dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The same icon the control page uses. Without it every display 404s on
       /favicon.ico as it loads, which is noise in the one console an operator
       looks at when a screen misbehaves. -->
  <link rel="icon" href="/icons/tv-solid-full.svg" type="image/svg+xml">
  <title>提词显示器</title>
  <script type="module" defer src="./scripts/viewerApp.ts"></script>
</head>

<body class="theme-default">
  <!-- The stage is the box the script is laid out in, and it is sized to the
       *reference* display rather than to this screen: every display lays out
       identically and scales the result to fit, so one shared scroll ratio
       lands on the same line everywhere. Told no dimensions, it takes this
       screen's own and the scale is 1, which is how a lone display behaves
       exactly as it did before the stage existed. See StageMessage.

       It is also the scroller. The viewport is not: viewerBase.css clips both
       html and body, so nothing can scroll the page out from under the stage. -->
  <div id="stage">
    <header id="header" class="viewer-clocks">
      <tp-clock class="left" id="timeTimer" type="timer" timer="00:00:00">00:00:00</tp-clock>
      <span id="message" class="mid"></span>
      <tp-clock class="right" id="timeClock" type="clock"></tp-clock>
    </header>
    <main id="main" class="content">

    </main>
  </div>
  <!-- The bottom of the read zone fades into the background, so the lines the
       talent is not yet on stop competing with the one they are. Outside
       #stage and fixed, because inside it would scroll with the script — the
       whole point is that it stays put while the words move under it.

       Only the bottom. A fade at the top would cross the clock strip, and the
       countdown is the one thing on screen that must stay legible while it is
       being read. Height and colour are tokens a theme can restyle; see
       viewerBase.css. -->
  <div class="viewer-fade" aria-hidden="true"></div>
  <!-- A line to read along, off by default. Set --viewer-guide to 1 in a theme
       to show it — see viewerBase.css for why it is not simply always there. -->
  <div class="viewer-guide" aria-hidden="true"></div>
  <!-- The way back to the operator's end, and the only chrome this page has.
       Outside #stage on purpose: the stage is the scroller and the thing a
       theme lays out, and this must survive both. Hidden until viewer.ts knows
       it has a room and is not the control page's preview iframe — a preview
       has no end of its own to switch from. The icon is inline rather than a
       wa-icon because this page registers no icon component, and the pill has
       to look the same on a display with no network to fetch a sprite from. -->
  <a id="switchEnd" class="end-switch" href="/control" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="m8 3-4 4 4 4" />
      <path d="M4 7h16" />
      <path d="m16 21 4-4-4-4" />
      <path d="M20 17H4" />
    </svg>
    <span>控制台</span>
  </a>
</body>

</html>
